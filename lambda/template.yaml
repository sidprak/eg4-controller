AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: EG4 battery discharge guardrail (Lambda container + EventBridge cron)

Parameters:
  EG4Username:
    Type: String
    NoEcho: true
    Description: EG4 cloud monitor login email
  EG4Password:
    Type: String
    NoEcho: true
    Description: EG4 cloud monitor password
  EG4SerialNumber:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional inverter serial. If blank, uses the first inverter on the account.
  ScheduleExpression:
    Type: String
    Default: "cron(*/30 * * * ? *)"
    Description: EventBridge cron expression (UTC). Default = every 30 min.
  DryRun:
    Type: String
    Default: "1"
    AllowedValues: ["0", "1"]
    Description: 1 = decide+log only, 0 = real writes. Keep 1 until you've watched a day of logs.
  PvCapOnW:
    Type: String
    Default: "1700"
    Description: PV watts above which the cap turns ON. Cap-on writes CapOnThresholdW.
  PvCapOffW:
    Type: String
    Default: "1200"
    Description: PV watts below which the cap turns OFF. Between cap-on and cap-off, previous state is held (hysteresis prevents flapping on spiky clouds).
  NormalDischargeThresholdW:
    Type: String
    Default: "100"
    Description: Grid-import threshold (W) restored when cap is OFF. Matches FlexBOSS21 factory "Start Discharge P_import(W)".
  CapOnThresholdW:
    Type: String
    Default: "30000"
    Description: Grid-import threshold (W) written when cap is ON. Well above any realistic home grid-import, so battery never discharges to on-grid loads.
  HoldParamDischarge:
    Type: String
    Default: "HOLD_P_TO_USER_START_DISCHG"
  PvField:
    Type: String
    Default: "ppv"
  AlarmEmail:
    Type: String
    Default: ""
    Description: |
      Email address for sustained-failure alerts. If blank, no alarm or
      SNS topic is created. AWS will send a one-time confirmation email
      to this address; click the link or no notifications will be
      delivered (subscription stays in PendingConfirmation).

Conditions:
  AlarmEmailProvided: !Not [!Equals [!Ref AlarmEmail, ""]]

Resources:
  GuardrailFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures: [arm64]
      MemorySize: 256
      # Worst-case run: ~30 s normal EG4 cloud latency + one write retry
      # (90 s sleep + ~5 s) + one verify-read retry (45 s + ~5 s) ≈ 175 s.
      # 240 s leaves headroom for cold start and longer cloud latency.
      Timeout: 240
      Events:
        ScheduledRun:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleExpression
            Description: EG4 guardrail scheduled run
            Input: '{}'
      Environment:
        Variables:
          EG4_USERNAME: !Ref EG4Username
          EG4_PASSWORD: !Ref EG4Password
          EG4_SERIAL_NUMBER: !Ref EG4SerialNumber
          EG4_DRY_RUN: !Ref DryRun
          EG4_PV_CAP_ON_W: !Ref PvCapOnW
          EG4_PV_CAP_OFF_W: !Ref PvCapOffW
          EG4_NORMAL_DISCHARGE_THRESHOLD_W: !Ref NormalDischargeThresholdW
          EG4_CAP_ON_THRESHOLD_W: !Ref CapOnThresholdW
          EG4_HOLD_PARAM_DISCHARGE: !Ref HoldParamDischarge
          EG4_PV_FIELD: !Ref PvField
      LoggingConfig:
        LogFormat: JSON
    Metadata:
      DockerTag: latest
      DockerContext: ../
      Dockerfile: lambda/Dockerfile

  # 14-day retention keeps log storage costs negligible (default is never expire).
  GuardrailFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${GuardrailFunction}
      RetentionInDays: 14

  # ----- Alerting (optional, only if AlarmEmail is set) -----

  AlertsTopic:
    Type: AWS::SNS::Topic
    Condition: AlarmEmailProvided
    Properties:
      DisplayName: EG4 guardrail alerts

  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: AlarmEmailProvided
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # "Sustained failure" alarm: fires only when the Lambda has at least one
  # error in EACH of the last 3 consecutive 1-hour buckets. With the
  # default 30-min schedule that's 6 invocations spanning 3 hours, so this
  # catches "the guardrail has been broken for a while" rather than "one
  # transient EG4 cloud blip that the retry logic should handle". The
  # retry logic in guardrail.py already handles single DEVICE_OFFLINE
  # bursts, so a single failed invocation is almost always noise.
  SustainedFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmEmailProvided
    Properties:
      AlarmName: !Sub ${AWS::StackName}-sustained-failure
      AlarmDescription: |
        EG4 guardrail has had at least one error in each of the last 3
        consecutive 1-hour windows. The retry logic already absorbs
        single transient failures, so this alarm indicates a real
        problem (auth broken, EG4 cloud down, register schema changed,
        write being rejected, etc).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref GuardrailFunction
      Statistic: Sum
      Period: 3600                       # 1 hour buckets
      EvaluationPeriods: 3               # look at last 3 buckets
      DatapointsToAlarm: 3               # all 3 must breach
      Threshold: 1                       # >=1 error per bucket
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching     # no invocations -> not a failure for THIS alarm
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]      # so you get the "all good" recovery email too

Outputs:
  FunctionName:
    Value: !Ref GuardrailFunction
    Description: Lambda function name (for manual invokes / log tailing)
  FunctionArn:
    Value: !GetAtt GuardrailFunction.Arn
  AlertsTopicArn:
    Condition: AlarmEmailProvided
    Value: !Ref AlertsTopic
    Description: SNS topic that fans out sustained-failure alerts
